<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVENTA+ — Simulador de finales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;600;800;900&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --cancha:#0C2A21;
  --cancha-2:#0A211A;
  --linea:#1B4A3A;
  --cal:#F2F0E4;
  --tiza:#8FA89C;
  --foco:#FFC94A;
  --roja:#E2503B;
  --azul:#6FB6DE;
  --gutter:3.4rem;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--cancha);
  color:var(--cal);
  font-family:'Newsreader',Georgia,serif;
  font-size:17px;line-height:1.5;
  min-height:100vh;
  padding-bottom:3rem;
}
.wrap{max-width:640px;margin:0 auto;padding:0 1.1rem}

/* ── tipografía utilitaria ── */
.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--tiza);
}
.cond{font-family:'Big Shoulders Display',Impact,sans-serif;line-height:.9;letter-spacing:.01em}

/* ── portada ── */
.portada{padding:3.5rem 0 2rem}
.logo{
  font-family:'Big Shoulders Display',sans-serif;
  font-weight:900;font-size:clamp(4rem,22vw,7.5rem);line-height:.8;
  letter-spacing:-.02em;
}
.logo span{color:var(--foco)}
.bajada{
  font-size:1.15rem;font-weight:300;color:var(--tiza);
  margin-top:1.1rem;max-width:26em;
}
.bajada em{color:var(--cal);font-style:italic}

/* ── bloques de selección ── */
.seccion{margin-top:2.4rem}
.seccion > .eyebrow{display:block;margin-bottom:.7rem}
.opts{display:grid;gap:.5rem}
.opts.dos{grid-template-columns:1fr 1fr}
.pick{
  background:transparent;color:var(--cal);
  border:1px solid var(--linea);
  border-radius:2px;
  padding:.75rem .9rem;
  text-align:left;font:inherit;font-size:.95rem;
  cursor:pointer;transition:border-color .15s,background .15s;
}
.pick:hover{border-color:var(--tiza)}
.pick[aria-pressed="true"]{
  border-color:var(--foco);
  background:rgba(255,201,74,.09);
}
.pick .t{
  display:block;
  font-family:'Big Shoulders Display',sans-serif;
  font-weight:700;font-size:1.3rem;letter-spacing:.02em;
  text-transform:uppercase;line-height:1;
}
.pick .d{display:block;color:var(--tiza);font-size:.82rem;margin-top:.3rem;line-height:1.35}
.pick[aria-pressed="true"] .d{color:var(--cal)}

/* fichas de final */
.ficha{display:block;width:100%}
.ficha .torneo{font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--tiza)}
.ficha .vs{
  font-family:'Big Shoulders Display',sans-serif;font-weight:800;
  font-size:1.45rem;line-height:1.05;margin:.25rem 0 .3rem;text-transform:uppercase;
}
.ficha .vs b{font-weight:400;color:var(--tiza)}
.hcap{display:flex;align-items:center;gap:.5rem;margin-top:.45rem}
.barras{display:flex;gap:3px}
.barras i{width:14px;height:5px;background:var(--linea);border-radius:1px}
.barras i.on{background:var(--foco)}
.hcap span{font-family:'IBM Plex Mono',monospace;font-size:.66rem;color:var(--tiza);letter-spacing:.06em}

.tabs{display:flex;gap:0;margin-bottom:.9rem;border-bottom:1px solid var(--linea)}
.tab{
  background:none;border:none;border-bottom:2px solid transparent;
  color:var(--tiza);font-family:'Big Shoulders Display',sans-serif;
  font-weight:700;font-size:1.25rem;letter-spacing:.03em;text-transform:uppercase;
  padding:.35rem .1rem;margin-right:1.4rem;cursor:pointer;line-height:1;
}
.tab[aria-selected="true"]{color:var(--cal);border-bottom-color:var(--foco)}
.subtitulo{display:block;margin:1.1rem 0 .55rem}
.calculo{
  border:1px solid var(--linea);border-radius:2px;
  padding:.8rem .9rem;margin-top:1.1rem;
}
.calculo .vs{
  font-family:'Big Shoulders Display',sans-serif;font-weight:800;
  font-size:1.5rem;line-height:1.05;text-transform:uppercase;
}
.calculo .vs b{font-weight:400;color:var(--tiza)}
.calculo .lectura{color:var(--tiza);font-size:.9rem;margin-top:.35rem;font-weight:300}
.calculo.vacio .vs{color:var(--tiza)}

.cta{
  display:block;width:100%;margin-top:2.2rem;
  background:var(--foco);color:#0C2A21;border:none;border-radius:2px;
  font-family:'Big Shoulders Display',sans-serif;font-weight:900;
  font-size:1.8rem;letter-spacing:.04em;text-transform:uppercase;
  padding:.7rem;cursor:pointer;
}
.cta:disabled{background:var(--linea);color:var(--tiza);cursor:not-allowed}

/* ── marcador fijo ── */
.marcador{
  position:sticky;top:0;z-index:10;
  background:var(--cancha-2);
  border-bottom:1px solid var(--linea);
  padding:.55rem 0 .5rem;
}
.mrow{display:flex;align-items:baseline;gap:.6rem}
.eq{
  font-family:'Big Shoulders Display',sans-serif;font-weight:700;
  font-size:1.05rem;text-transform:uppercase;letter-spacing:.03em;
  flex:1;line-height:1;
}
.eq.der{text-align:right}
.gol{
  font-family:'Big Shoulders Display',sans-serif;font-weight:900;
  font-size:2rem;line-height:.8;
}
.gol.propio{color:var(--azul)}
.gol.rival{color:var(--roja)}
.guion{color:var(--tiza);font-size:1.1rem}
.min{
  font-family:'IBM Plex Mono',monospace;font-size:.72rem;
  color:var(--foco);min-width:3.2em;text-align:right;
}
.barritas{display:flex;gap:.9rem;margin-top:.45rem}
.stat{flex:1}
.stat .lbl{font-family:'IBM Plex Mono',monospace;font-size:.56rem;letter-spacing:.12em;color:var(--tiza);text-transform:uppercase}
.track{height:3px;background:var(--linea);margin-top:3px;border-radius:2px;overflow:hidden}
.fill{height:100%;background:var(--tiza);transition:width .4s ease}
.fill.conf{background:var(--foco)}
.tarjeta{
  font-family:'IBM Plex Mono',monospace;font-size:.6rem;
  color:var(--roja);letter-spacing:.1em;text-transform:uppercase;
}
@keyframes flash{0%,100%{background:var(--cancha-2)}30%{background:rgba(255,201,74,.22)}}
.marcador.flash{animation:flash .7s ease}

/* ── relato ── */
.relato{padding-top:1.4rem}
.linea{
  display:grid;grid-template-columns:var(--gutter) 1fr;
  gap:.2rem;margin-bottom:1.05rem;
  animation:entra .45s ease both;
}
@keyframes entra{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.linea .m{
  font-family:'Big Shoulders Display',sans-serif;font-weight:700;
  font-size:1.5rem;color:var(--linea);line-height:1;padding-top:.15rem;
  letter-spacing:.02em;
}
.linea p{font-weight:300;font-size:1.08rem}
.linea.tuyo .m{color:var(--foco)}
.linea.tuyo p{font-weight:400}
.linea.gol .m{color:var(--foco)}
.linea.gol p{
  font-family:'Big Shoulders Display',sans-serif;font-weight:900;
  font-size:2.2rem;line-height:.95;text-transform:uppercase;letter-spacing:.01em;
}
.linea.contra .m{color:var(--roja)}
.linea.contra p{
  font-family:'Big Shoulders Display',sans-serif;font-weight:700;
  font-size:1.6rem;line-height:1;text-transform:uppercase;color:var(--tiza);
}
.linea.card p{color:var(--roja);font-style:italic}
.delta{
  display:inline-block;
  font-family:'IBM Plex Mono',monospace;font-size:.6rem;
  letter-spacing:.08em;text-transform:uppercase;
  margin-left:.55rem;white-space:nowrap;vertical-align:middle;
  padding:.12rem .35rem;border-radius:2px;
}
.delta.mas{color:var(--foco);border:1px solid rgba(255,201,74,.45)}
.delta.menos{color:var(--roja);border:1px solid rgba(226,80,59,.45)}
.linea.amb p{color:var(--tiza);font-style:italic}
.linea.evento .m{color:var(--foco)}
.linea.evento p{
  color:var(--cal);font-style:normal;
  border-left:2px solid var(--foco);padding-left:.7rem;
}
.linea.evento p::before{
  content:"◆ ";color:var(--foco);font-size:.7em;vertical-align:middle;
}

/* ── decisión: único elemento con caja ── */
.decision{
  border:1px solid var(--foco);border-radius:2px;
  padding:1rem;margin:.4rem 0 1.4rem;
  background:rgba(255,201,74,.05);
  animation:entra .45s ease both;
}
.decision .eyebrow{color:var(--foco);display:block;margin-bottom:.55rem}
.decision .situacion{font-size:1.12rem;font-weight:400;margin-bottom:.95rem}
.acciones{display:grid;gap:.45rem}
.accion{
  display:flex;justify-content:space-between;align-items:center;gap:.7rem;
  background:transparent;border:1px solid var(--linea);border-radius:2px;
  color:var(--cal);font:inherit;font-size:.98rem;text-align:left;
  padding:.65rem .8rem;cursor:pointer;transition:border-color .15s,background .15s;
}
.accion:hover{border-color:var(--cal);background:rgba(242,240,228,.04)}
.accion .rg{
  font-family:'IBM Plex Mono',monospace;font-size:.58rem;
  letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;flex-shrink:0;
}
.rg.alto{color:var(--roja)}
.rg.medio{color:var(--foco)}
.rg.bajo{color:var(--tiza)}
.rg.seguro{color:var(--tiza)}
.rg.medio{color:var(--foco)}
.rg.arriesgado{color:var(--roja)}
.rg.veto{color:var(--linea)}
.accion.bloqueada{
  border-style:dashed;border-color:var(--linea);
  color:var(--linea);cursor:not-allowed;
}
.accion.bloqueada:hover{background:transparent;border-color:var(--linea)}
.accion.comodin{border-color:var(--foco);border-style:dashed;background:rgba(255,201,74,.06)}
.accion.comodin:hover{background:rgba(255,201,74,.12)}
.rg.carta{color:var(--foco)}

/* ── epílogo ── */
.epilogo{border-top:1px solid var(--linea);margin-top:1.2rem;padding-top:1.6rem}
.veredicto{
  font-family:'Big Shoulders Display',sans-serif;font-weight:900;
  font-size:clamp(2.8rem,15vw,4.6rem);line-height:.82;letter-spacing:-.01em;
  text-transform:uppercase;
}
.veredicto.campeon{color:var(--foco)}
.epilogo p{margin-top:1rem;font-weight:300;font-size:1.1rem}
.resumen{margin-top:1.4rem;border-top:1px solid var(--linea);padding-top:.9rem}
.resumen div{
  display:flex;justify-content:space-between;gap:1rem;
  font-family:'IBM Plex Mono',monospace;font-size:.72rem;
  padding:.32rem 0;color:var(--tiza);
}
.resumen div b{color:var(--cal);font-weight:500;text-align:right}

:focus-visible{outline:2px solid var(--foco);outline-offset:2px}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
@media (max-width:400px){
  :root{--gutter:2.8rem}
  body{font-size:16px}
}
</style>
</head>

/* ¿Está el partido en la situación que pide esta carta? */
function comodinActivo(c){
  if(!c || S.comodinUsado) return false;
  const est = S.gp>S.gr?"ganando":S.gp<S.gr?"perdiendo":"empatando";
  const dif = S.gp - S.gr;
  return est===c.cond.marcador
      && S.minuto >= c.cond.min
      && (!c.cond.dif || (dif>=c.cond.dif[0] && dif<=c.cond.dif[1]));
}

      <span class="eyebrow">01 — En qué puesto juegas</span>
      <div class="opts dos" id="gPos"></div>
    </div>

    <div class="seccion" id="secComodin" hidden>
      <span class="eyebrow">02 — Tu jugada</span>
      <p class="lectura" style="margin-bottom:.7rem">Una sola vez en el partido, y solo si se da la situación. Estás apostando a cómo va a venir la final.</p>
      <div class="opts" id="gComodin"></div>
    </div>

    <div class="seccion">
      <span class="eyebrow">03 — Contra quién</span>
      <span class="eyebrow subtitulo">Tu equipo</span>
      <div class="opts dos" id="gYo"></div>
      <span class="eyebrow subtitulo">El rival</span>
      <div class="opts dos" id="gRiv"></div>
      <div class="calculo vacio" id="calc"></div>
      <button class="pick" id="azar" style="margin-top:.8rem;text-align:center">
        <span class="t">Sorpréndeme</span>
        <span class="d">Puesto y equipos al azar</span>
      </button>
    </div>

    <button class="cta" id="jugar" disabled>Salir a la cancha</button>
  `;

  const elegirPuesto = (p)=>{
    sel.pos=p;
    marcarPorNombre("#gPos", p.nombre);
    sel.comodin=null;
    $("#secComodin").hidden=false;
    $("#gComodin").innerHTML="";
    COMODINES[p.id].forEach(c=>{
      const b=document.createElement("button");
      b.className="pick"; b.setAttribute("aria-pressed","false"); b.dataset.nombre=c.nombre;
      b.innerHTML=`<span class="t">${c.nombre}</span><span class="d">${c.desc}</span>`;
      b.onclick=()=>{ sel.comodin=c; marcarPorNombre("#gComodin", c.nombre); chequear(); };
      $("#gComodin").appendChild(b);
    });
    chequear();
  };
  POSICIONES.forEach(p=>{
    const b=document.createElement("button");
    b.className="pick"; b.setAttribute("aria-pressed","false");
    b.dataset.nombre=p.nombre;
    b.innerHTML=`<span class="t">${p.nombre}</span><span class="d">${p.desc}</span>`;
    b.onclick=()=>elegirPuesto(p);
    $("#gPos").appendChild(b);
  });


  // ── modo libre: elegís los dos equipos ──
  const libre = { yo:null, riv:null };

  const fichaEquipo = (e, cont, lado)=>{
    const b=document.createElement("button");
    b.className="pick"; b.setAttribute("aria-pressed","false");
    b.dataset.nombre=e.nombre;
    b.innerHTML=`<span class="t">${e.nombre}</span><span class="d">${e.tipo}</span>`;
    b.onclick=()=>{
      libre[lado]=e; marcar(cont,b);
      if(libre.yo && libre.riv && libre.yo.nombre===libre.riv.nombre){
        (lado==="yo"?libre.riv=null:libre.yo=null);
        document.querySelectorAll((lado==="yo"?"#gRiv":"#gYo")+" .pick")
          .forEach(x=>x.setAttribute("aria-pressed","false"));
      }
      armarFinal(libre);
    };
    $(cont).appendChild(b);
  };
  EQUIPOS.forEach(e=>fichaEquipo(e,"#gYo","yo"));
  EQUIPOS.forEach(e=>fichaEquipo(e,"#gRiv","riv"));

  $("#azar").onclick=()=>{
    const p = pick(POSICIONES);
    let yo = pick(EQUIPOS), riv = pick(EQUIPOS);
    while(riv.nombre===yo.nombre) riv = pick(EQUIPOS);
    elegirPuesto(p);
    sel.comodin = pick(COMODINES[p.id]);
    marcarPorNombre("#gComodin", sel.comodin.nombre);
    libre.yo=yo; libre.riv=riv;
    marcarPorNombre("#gYo", yo.nombre); marcarPorNombre("#gRiv", riv.nombre);
    armarFinal(libre);
    $("#calc").scrollIntoView({behavior:"smooth",block:"center"});
  };

  $("#jugar").onclick=arrancar;
}

/* Construye una final a partir de dos equipos y actualiza el lector de hándicap */
function armarFinal(libre){
  const c = $("#calc"); if(!c) return;
  if(!libre.yo || !libre.riv){
    c.className="calculo vacio";
    c.innerHTML=`<div class="vs">Elige los dos equipos</div>
      <div class="lectura">El hándicap sale de la diferencia de nivel entre ambos.</div>`;
    sel.final=null; chequear(); return;
  }
  const d = libre.yo.nivel - libre.riv.nivel;
  const fuerza = clamp(0.5 + d/90, 0.18, 0.82);
  const dificultad = clamp(Math.round(6 - fuerza*7), 1, 5);
  const lectura = lecturaDe(d);
  c.className="calculo";
  c.innerHTML=`
    <div class="vs">${libre.yo.nombre} <b>vs</b> ${libre.riv.nombre}</div>
    <div class="lectura">${lectura}</div>`;

  sel.final = construirFinal(libre.yo, libre.riv);
  chequear();
}

/* Arma el objeto de la final a partir de dos equipos. */
function construirFinal(yo, riv){
  const d = yo.nivel - riv.nivel;
  const fuerza = clamp(0.5 + d/90, 0.18, 0.82);
  return {
    id:"libre", torneo:"Final — partido único",
    equipo:yo.nombre, rival:riv.nombre,
    sede:pick(SEDES), fuerza, dificultad:clamp(Math.round(6-fuerza*7),1,5),
    zona: (yo.zona==="Sudamérica" && riv.zona==="Sudamérica") ? "Sudamérica" : "Mixta",
    nota:lecturaDe(d),
    arranque:{ minuto:0, gp:0, gr:0 },
    guion: GUION_LIBRE.map(g=>({...g,
      txt:g.txt.replace(/\{rival\}/g,riv.nombre).replace(/\{equipo\}/g,yo.nombre)}))
  };
}
function lecturaDe(d){
  return d >=  10 ? "Parten favoritos. Perder acá sería un papelón." :
         d >=   3 ? "Levemente arriba. Alcanza para nada." :
         d >=  -3 ? "Final pareja. Se define en un detalle." :
         d >= -10 ? "Parten abajo. Va a haber que sufrir." :
                    "Nadie da un peso por ustedes. Por eso vale.";
}
function marcarPorNombre(cont, nombre){
  document.querySelectorAll(cont+" .pick").forEach(b=>
    b.setAttribute("aria-pressed", b.dataset.nombre===nombre ? "true" : "false"));
}
function marcar(cont,btn){
  document.querySelectorAll(cont+" .pick").forEach(b=>b.setAttribute("aria-pressed","false"));
  btn.setAttribute("aria-pressed","true");
}
function chequear(){ $("#jugar").disabled = !(sel.pos&&sel.comodin&&sel.final); }

/* ── Arranque ── */
function arrancar(){
  const st = {...sel.pos.base};
  const a = sel.final.arranque;
  S = {
    final:sel.final, pos:sel.pos.id, stats:st,
    comodin:sel.comodin, comodinUsado:false,
    minuto:a.minuto, gp:a.gp, gr:a.gr,
    ofensiva:sel.pos.ofensiva, defensiva:sel.pos.defensiva,
    cupos:Math.max(2, Math.round(ri(sel.pos.cupos[0],sel.pos.cupos[1]) * (90-a.minuto)/90)),
    energia:100, confianza:50,
    amarilla:false, roja:false,
    hitos:[], usados:new Set(), guion:sel.final.guion.map(g=>({...g,hecho:false})), grupos:new Set(),
    decisiones:0, fin:false, alargue:false, penales:false, interrumpido:false, rescatado:false, descanso:false, tanda:null, penalMio:null,
  };
  pantallaPartido();
}

/* ── Pantalla 2: el partido ── */
function pantallaPartido(){

    <div class="marcador" id="mk"></div>

  siguiente();
}

function badge(v, etiqueta){

  return `<span class="delta ${v>0?"mas":"menos"}">${v>0?"+":"−"} ${etiqueta}</span>`;
}
function linea(min, txt, clase="", d2){

  d.className="linea "+clase;
  const marcas = d2 ? badge(d2.conf,"confianza")+badge(d2.energia,"energía") : "";

/* ── Probabilidad ── */
/* Mientras prototipas conviene ver el número real en vez de la etiqueta:
   deja a la vista los momentos donde todas las opciones son lo mismo.
   Para el público, poner en false. */
const MOSTRAR_PROBABILIDAD = true;

const K = 0.17;   // valor esperado, en goles, de cada decisión

/* Lo que cuesta una jugada. Se deriva del atributo que exige, salvo que la
   opción declare su propio `costo`. Con ~45 de energía al minuto 90, esto
   significa tres o cuatro jugadas fuertes en todo el partido. */
const COSTO = { fisico:15, tecnica:7, temple:4 };
const costoDe = op => op.costo != null ? op.costo : (COSTO[op.stat] || 6);

/* Los lujos piden estar encendido: si la confianza está baja, ni se te ocurren. */
const CONFIANZA_LUJO = 55;
const pideConfianza = op => (op.ok.hito==="golazo" || op.ok.hito==="lujo") ? CONFIANZA_LUJO : 0;

/* Por qué no puedes elegir esta opción ahora mismo (o null si puedes). */
function bloqueo(op){
  if(S.energia < costoDe(op) + 4) return "no te dan las piernas";
  if(S.confianza < pideConfianza(op)) return "ni se te pasa por la cabeza";
  return null;
}

/* Etiqueta de riesgo: se calcula con la probabilidad real de este instante,
   no se lee de la config. La misma jugada dice otra cosa en el alargue. */
function etiqueta(p){
  if(MOSTRAR_PROBABILIDAD) return Math.round(p*100)+"%";
  return p >= 0.55 ? "seguro" : p >= 0.32 ? "medio" : "arriesgado";
}
function claseRiesgo(p){
  return p >= 0.55 ? "seguro" : p >= 0.32 ? "medio" : "arriesgado";
}

/* Cuánto mejora el partido si la opción sale bien.
   El `hito` suma encima: una jugada memorable vale más que la misma jugada
   sin historia, y por eso el motor le baja la probabilidad. Es la palanca
   para que dentro de un mismo momento haya opciones con distinto riesgo. */
function premioDe(r){
  const base = r.gol ? 1.00 : r.penal ? 0.76 : r.roja ? 0.60 : 0.55;
  return base + (r.hito ? 0.35 : 0);
}
// Cuánto empeora si sale mal
function castigoDe(r){
  if(r.golContra)   return 1.00;
  if(r.penalContra) return 0.85;
  if(r.roja)        return 0.75;
  if(r.amarilla)    return 0.25;
  return 0.15;
}

/* La probabilidad no se escribe: se calcula para que toda decisión
   valga lo mismo. EV = p*premio - (1-p)*castigo = K  →  p = (K+castigo)/(premio+castigo) */
function prob(op, stat){
  /* Si la opción trae `p`, manda ese número: es la escotilla para momentos
     donde el valor esperado no aplica (brujería, penales, cábalas). */
  let p;
  if(op.p !== undefined){
    p = op.p;
  }else{
    const premio  = premioDe(op.ok);
    const castigo = castigoDe(op.no);
    p = (K + castigo) / (premio + castigo);
  }
  p *= 1 + (S.stats[stat]-50)/130;      // tu atributo
  p *= 0.62 + S.final.fuerza*0.82;      // hándicap del equipo
  p *= 0.88 + (S.confianza/100)*0.24;   // racha
  p *= 0.88 + (S.energia/100)*0.24;     // piernas
  return clamp(p, 0.08, 0.86);
}

// Los penales tienen probabilidad propia: no pasan por el cálculo de valor esperado.
function probFija(base, stat){
  let p = base;
  p *= 1 + (S.stats[stat]-50)/130;
  p *= 0.88 + (S.confianza/100)*0.24;
  return clamp(p, 0.06, 0.92);
}

/* ── Bucle principal ── */
function siguiente(){
  if(S.fin) return;

  // guion histórico pendiente
  const g = S.guion.find(x=>!x.hecho && x.min<=S.minuto+6);
  if(g){
    g.hecho=true;
    S.minuto=Math.max(S.minuto,g.min);
    if(g.tipo==="amb"){
      if(g.min===45 && !S.descanso){   // entretiempo: quince minutos de vestuario
        S.descanso = true;
        const antes = S.energia;
        S.energia = clamp(Math.max(S.energia + 26, 62), 5, 100);
        linea(S.minuto, g.txt+" Quince minutos de vestuario y vuelves con otras piernas.", "amb", { energia:S.energia-antes });
      } else linea(S.minuto,g.txt,"amb");
    }
    else if(g.tipo==="propio"){
      if(Math.random()<g.prob*(0.7+S.final.fuerza*0.6)){ S.gp++; linea(S.minuto,g.txt+" <b>Adentro.</b>","gol"); pintarMarcador(true); }
      else linea(S.minuto,g.txt+" Se pierde por poco.","amb");
    } else {
      if(Math.random()<g.prob*(S.roja?1.5:1)*(1.5-S.final.fuerza)){ S.gr++; linea(S.minuto,g.txt+" Gol del "+S.final.rival+".","contra"); pintarMarcador(true); }
      else linea(S.minuto,g.txt+" La sacan al córner.","amb");
    }
    pintarMarcador();
    S.minuto+=ri(2,5);
    return setTimeout(siguiente, 750);
  }

  // fin del tiempo
  const limite = S.alargue?120:90;
  if(S.minuto>=limite){
    if(S.gp!==S.gr) return terminar();
    if(!S.alargue){ S.alargue=true; S.minuto=91;
      // Hay descanso antes del alargue: se recupera algo, nunca se llega en cero
      S.energia = clamp(Math.max(S.energia + 22, 46), 5, 100);
      linea("", "Empate. Hay unos minutos de respiro, agua, y treinta minutos más. Las piernas no son las mismas, pero todavía responden.","amb",
            { energia:+1 });
      pintarMarcador(); return setTimeout(siguiente,800); }
    return penales();
  }

  S.minuto += ri(3,6);
  S.energia = clamp(S.energia - rnd(0.8,2.2), 5, 100);   // el desgaste pasivo baja: ahora se gasta decidiendo
  S.confianza += (50 - S.confianza) * 0.05;               // la racha, buena o mala, se diluye sola

  // si estás expulsado, ya no decides nada
  if(S.roja){
    if(Math.random()<0.30){
      const p = 0.16*(1.6-S.final.fuerza);
      if(Math.random()<p){ S.gr++; linea(S.minuto, "Con uno menos no alcanzan las piernas. Gol del "+S.final.rival+".","contra"); pintarMarcador(true); }
      else linea(S.minuto, "Aguantan como pueden. Tú miras desde afuera, que es peor.","amb");
    } else linea(S.minuto, relleno(), "amb");
    pintarMarcador();
    return setTimeout(siguiente, 700);
  }

  ambiente();

  /* ¿toca decisión? El total del partido ya está sorteado: acá solo se decide
     dónde caen. Partido abierto las junta, partido resuelto las estira. */
  if(S.decisiones < S.cupos){
    const limite = S.alargue?120:90;
    const pasos  = Math.max(1, (limite - S.minuto)/6.0);
    const dif    = Math.abs(S.gp - S.gr);
    const tension = dif<=1 ? 1.35 : dif===2 ? 1.00 : 0.55;
    const urgencia = comodinActivo(S.comodin) ? 1.9 : 1;
    const p = clamp(((S.cupos - S.decisiones)/pasos) * tension * urgencia, 0, 0.95);
    if(Math.random() < p){
      const m = elegirMomento();
      if(m) return mostrarDecision(m);
    }
  }
  linea(S.minuto, relleno(), "amb");
  pintarMarcador();
  setTimeout(siguiente, 700);
}

// goles que pasan lejos de ti. Acá es donde se siente el hándicap del equipo.
function relleno(){
  const ok = AMBIENTE.filter(a => S.minuto>=(a.min||0) && S.minuto<=(a.max||130));
  return pick(ok.length?ok:AMBIENTE).txt;
}

function ambiente(){
  // Tu equipo marca sin vos
  if(Math.random() < 0.34*S.ofensiva && Math.random() < 0.62*(S.final.fuerza+0.05)){
    S.gp++; S.confianza=clamp(S.confianza+6,5,100);
    linea(S.minuto, pick(GOL_FAVOR)+" <b>Gol.</b>","gol");
    pintarMarcador(true);
  }
  // El rival marca sin vos: el relato depende de tu puesto
  if(Math.random() < 0.34*S.defensiva && Math.random() < 0.62*(1.05-S.final.fuerza)){
    S.gr++; S.confianza=clamp(S.confianza-7,5,100);
    linea(S.minuto, pick(GOL_CONTRA[S.pos])+" Gol del "+S.final.rival+".","contra");
    pintarMarcador(true);
  }
  // Rescate: solo con la confianza en el suelo, y una vez por partido
  if(S.confianza < 30 && !S.rescatado && Math.random() < 0.5){
    S.rescatado = true;
    const aptos = RESCATES.filter(x=>!x.pos || x.pos.includes(S.pos));
    const r = pick(aptos);
    const antes = S.confianza;
    S.confianza = clamp(S.confianza + r.conf, 5, 100);
    linea(S.minuto, r.txt, "evento", { conf:S.confianza-antes });
    pintarMarcador();
  }

  // La tribuna
  if(Math.random() < 0.16){
    const est = S.gp>S.gr?"ganando":S.gp<S.gr?"perdiendo":"empatando";
    const ok = HINCHADA.filter(h =>
      (!h.marcador || h.marcador===est) &&
      (!h.requiereHito || S.hitos.includes(h.requiereHito)));
    if(ok.length){
      const h = pick(ok);
      const antes = S.confianza;
      S.confianza = clamp(S.confianza + h.conf, 5, 100);
      linea(S.minuto, h.txt, "evento", { conf:S.confianza-antes });
      pintarMarcador();
    }
  }
  // Interrupciones raras
  if(!S.interrumpido) for(const i of INTERRUPCIONES){
    if(i.min && S.minuto < i.min) continue;
    if(i.zona && S.final.zona !== i.zona) continue;
    if(Math.random() < i.prob){
      S.interrumpido = true;
      const antes = S.energia;
      S.energia = clamp(S.energia + i.energia, 5, 100);
      linea(S.minuto, i.txt, "evento", { energia:S.energia-antes });
      pintarMarcador();
      break;
    }
  }
}

/* Cascada de rescate: si no hay nada elegible, se relajan condiciones en orden.
   Nunca se relajan `marcador` ni `dif`, porque los textos los nombran. */
function elegirMomento(){
  const estado = S.gp>S.gr?"ganando":S.gp<S.gr?"perdiendo":"empatando";
  const dif = S.gp - S.gr;
  const contexto = m =>
    (m.marcador==="cualquiera"||m.marcador===estado) &&
    (!m.dif || (dif>=m.dif[0] && dif<=m.dif[1])) &&
    (!m.requiereAmarilla || S.amarilla) &&
    (!m.requiereHito || S.hitos.includes(m.requiereHito)) &&
    (!m.pos || m.pos.includes(S.pos));
  const ventana = m => S.minuto>=(m.cuando?m.cuando[0]:0) && S.minuto<=(m.cuando?m.cuando[1]:120);
  const fresco  = m => !S.usados.has(m.id);
  // Grupos excluyentes: si ya salió uno del grupo, ninguno más en el partido
  const grupoLibre = m => !m.grupo || !S.grupos.has(m.grupo);

  const banco = MOMENTOS[S.pos].concat(COMUNES);
  const cerca = m => S.minuto>=(m.cuando?m.cuando[0]:0)-25 && S.minuto<=(m.cuando?m.cuando[1]:120)+25;
  const repetible = m => !m.unaVez || fresco(m);
  /* Los momentos `raro` compiten siempre por su peso, pero nunca entran a la
     cascada de rescate: si no, cuando el banco se agota ganan por descarte y
     terminan apareciendo mucho más de lo que deberían. */
  const normal = m => !m.raro;
  const cascada = [
    banco.filter(m=>normal(m) && contexto(m) && grupoLibre(m) && ventana(m) && fresco(m)),
    banco.filter(m=>normal(m) && contexto(m) && grupoLibre(m) && ventana(m) && repetible(m)),
    banco.filter(m=>normal(m) && contexto(m) && grupoLibre(m) && cerca(m) && repetible(m)),
  ];
  const raros = banco.filter(m=>m.raro && contexto(m) && grupoLibre(m) && ventana(m) && fresco(m));
  const pool = (cascada.find(c=>c.length) || []).concat(raros);
  if(!pool.length) return null;

  /* El partido se inclina solo: yendo abajo salen más jugadas de ataque,
     yendo arriba más de resistencia. Recién desde la segunda mitad, cuando
     el resultado empieza a pesar de verdad. */
  const urge = S.minuto >= 55;
  const sesgo = m => {
    if(!urge || !m.tono) return 1;
    if(dif < 0) return m.tono==="ataque"  ? 1.7 : 0.7;
    if(dif > 0) return m.tono==="defensa" ? 1.5 : 0.7;
    return 1;
  };

  // Los vistos en partidas recientes pesan menos: rota el contenido entre partidas.
  const peso = m => m.peso * sesgo(m)
    * (recientes.includes(m.id) ? 0.2 : 1)
    * (S.usados.has(m.id) ? 0.3 : 1);
  const total = pool.reduce((a,m)=>a+peso(m),0);
  let r = Math.random()*total;
  for(const m of pool){ r-=peso(m); if(r<=0) return m; }
  return pool[0];
}

function mostrarDecision(m, gratis){
  S.usados.add(m.id);
  if(m.grupo) S.grupos.add(m.grupo);
  if(!gratis) S.decisiones++;
  const box=document.createElement("div");
  box.className="decision";
  box.innerHTML=`<span class="eyebrow">${gratis?"Justo después":"Minuto "+S.minuto} — decides tú</span>
    <p class="situacion">${(m.txtPos && m.txtPos[S.pos]) || m.txt}</p><div class="acciones"></div>`;
  const disponibles = m.ops.filter(op=>!op.pos || op.pos.includes(S.pos));
  /* Si el cansancio bloquearía TODAS, se deja abierta la más barata:
     una decisión sin salida no es una decisión. */
  const todasVetadas = disponibles.every(op=>bloqueo(op));
  const rescatada = todasVetadas
    ? disponibles.reduce((a,b)=> costoDe(b)<costoDe(a)?b:a)
    : null;
  disponibles.forEach(op=>{
    const b=document.createElement("button");
    const veto = op===rescatada ? null : bloqueo(op);
    if(veto){
      b.className="accion bloqueada"; b.disabled=true;
      b.innerHTML=`<span>${op.txt}</span><span class="rg veto">${veto}</span>`;
    }else{
      const pr = prob(op, op.stat);
      b.className="accion";
      b.innerHTML=`<span>${op.txt}</span><span class="rg ${claseRiesgo(pr)}">${etiqueta(pr)}</span>`;
      b.onclick=()=>resolver(m,op,box);
    }
    box.querySelector(".acciones").appendChild(b);
  });
  if(!gratis && comodinActivo(S.comodin)){
    const c=S.comodin;
    const b=document.createElement("button");
    b.className="accion comodin";
    b.innerHTML=`<span>${c.txt}</span><span class="rg carta">${c.nombre}</span>`;
    b.onclick=()=>resolverComodin(box);
    box.querySelector(".acciones").appendChild(b);
  }
  $("#rl").appendChild(box);
  box.scrollIntoView({behavior:"smooth",block:"center"});
  pintarMarcador();
}

/* El comodín no pasa por el cálculo de valor esperado: lleva su propia
   probabilidad y, en el caso del delantero, ignora el hándicap del rival. */
function resolverComodin(box){
  const c=S.comodin;
  S.comodinUsado=true;
  box.remove();
  linea(S.minuto, `<em>${c.txt}.</em>`, "tuyo");
  let p=c.p;
  if(!c.ignoraHandicap) p *= 0.62 + S.final.fuerza*0.82;
  p *= 0.90 + (S.energia/100)*0.20;
  const exito = Math.random() < clamp(p,0.08,0.90);
  const r = exito?c.ok:c.no;
  aplicar(r);
  setTimeout(()=>{
    linea(S.minuto, r.gol? r.txt+" <b>¡Gol!</b>" : r.txt, r.gol?"gol":(r.golContra?"contra":"tuyo"));
    pintarMarcador(r.gol||r.golContra);
    S.minuto+=ri(2,5);
    const reac = REACCIONES.filter(x=>x.tras==="gol" && !S.usados.has(x.id));
    const propio = r.gol && r.hito!=="asistencia";
    if(propio && reac.length && !S.roja){
      const elegida = pick(reac);
      if(Math.random() < elegida.prob) return setTimeout(()=>mostrarDecision(elegida, true), 900);
    }
    setTimeout(siguiente, 900);
  }, 420);
}

function resolver(m,op,box){
  box.remove();
  linea(S.minuto, `<em>${op.txt}.</em>`, "tuyo");
  const pReal = prob(op, op.stat);
  const exito = Math.random() < pReal;
  const r = exito?op.ok:op.no;

  const antesC = S.confianza, antesE = S.energia;
  S.energia = clamp(S.energia - costoDe(op), 5, 100);
  // Lo que te hace la decisión en sí, más allá de si salió: jugártela sostiene.
  S.confianza = clamp(S.confianza + (exito ? (1-pReal)*16 : -pReal*16), 5, 100);
  aplicar(r);
  const dC = S.confianza-antesC, dE = S.energia-antesE;
  const rebota = !exito && r.rebote && Math.random() < r.rebote;
  let clase = r.gol?"gol":(r.golContra?"contra":(r.roja?"card":""));
  setTimeout(()=>{
    linea(S.minuto, r.gol? r.txt+" <b>¡Gol!</b>" : r.txt, clase, { conf:dC, energia:dE });
    if(!exito && r.deja==="contra"){
      setTimeout(()=>{
        if(Math.random() < 0.34*(1.45-S.final.fuerza)){
          S.gr++; S.confianza=clamp(S.confianza-10,5,100);
          linea(S.minuto, "Y salen de contra con todo el campo por delante. Nadie llega a cerrar. Gol del "+S.final.rival+", y empezó en tu error.", "contra");
        } else {
          linea(S.minuto, "Salen de contra y por poco no la meten. Tu arquero la saca con el pie y te busca con la mirada.", "amb", { conf:-1 });
          S.confianza = clamp(S.confianza-6, 5, 100);
        }
        pintarMarcador(true);
      }, 800);
    }
    if(rebota){
      S.gp++; S.hitos.push("gol_equipo","rebote");
      setTimeout(()=>{ linea(S.minuto, r.reboteTxt+" <b>Gol.</b>", "gol"); pintarMarcador(true); }, 700);
    }
    if(r.penal) cobrarPenal(true);
    if(r.penalContra) cobrarPenal(false);
    pintarMarcador(r.gol||r.golContra);
    S.minuto+=ri(2,5);
    const reac = REACCIONES.filter(x=>x.tras==="gol" && !S.usados.has(x.id));
    const propio = r.gol && r.hito!=="asistencia";
    if(propio && reac.length && !S.roja){
      const elegida = pick(reac);
      if(Math.random() < elegida.prob) return setTimeout(()=>mostrarDecision(elegida, true), 900);
    }
    setTimeout(siguiente, 900);
  }, 420);
}

function aplicar(r){
  if(r.ef){
    if(r.ef.energia) S.energia=clamp(S.energia+r.ef.energia,5,100);
    if(r.ef.confianza){
      // Al que la está pasando mal, una buena lo levanta más
      const escala = r.ef.confianza>0 ? 1 + Math.max(0,(50-S.confianza))/70 : 1;
      S.confianza=clamp(S.confianza + r.ef.confianza*escala, 5, 100);
    }
  }
  if(r.gol){ S.gp++; S.confianza=clamp(S.confianza+18,5,100);
             S.hitos.push(r.hito==="asistencia" ? "gol_equipo" : "gol"); }
  if(r.golContra){ S.gr++; S.confianza=clamp(S.confianza-14,5,100); S.hitos.push("culpa"); }
  if(r.amarilla){
    if(S.amarilla){ S.roja=true; S.hitos.push("roja","doble_amarilla"); }
    else S.amarilla=true;
  }
  if(r.roja){ S.roja=true; S.hitos.push("roja"); }
  if(r.hito) S.hitos.push(r.hito);
}

function cobrarPenal(aFavor){
  setTimeout(()=>{
    if(aFavor){
      if(Math.random()<0.76){ S.gp++; linea(S.minuto,"Lo patean con el arco entero por delante. <b>Adentro.</b>","gol"); }
      else linea(S.minuto,"Penal desviado en una final. Eso no se olvida nunca.","contra");
    }else{
      if(Math.random()<0.78){ S.gr++; linea(S.minuto,"Gol de penal del "+S.final.rival+".","contra"); }
      else linea(S.minuto,"El penal se va afuera. Te salvaste de milagro.","gol");
    }
    pintarMarcador(true);
  },500);
}

/* ── Penales ── */
function penales(){
  S.penales=true; pintarMarcador();
  linea("", "Ciento veinte minutos y nada. Se define desde los doce pasos.","amb");
  if(S.roja){ simularTanda(); return; }
  setTimeout(()=>{
    if(S.pos==="ARQ") decisionAtajar();
    else decisionPatear();
  },800);
}

function tandaBase(){
  // simula 4 pares; devuelve [propios, rivales]
  let a=0,b=0;
  const pProp = 0.70 + (S.final.fuerza-0.5)*0.45;
  const pRiv  = 0.76 - (S.final.fuerza-0.5)*0.40;
  for(let i=0;i<4;i++){ if(Math.random()<pProp)a++; if(Math.random()<pRiv)b++; }
  return [a,b];
}

function decisionPatear(){
  const box=document.createElement("div"); box.className="decision";
  const [a,bb]=tandaBase(); S.tanda=[a,bb];
  const enJuego = a>bb ? "Si la metes, son campeones."
                : a<bb ? "Si la fallas, se acabó."
                : "Si la metes, quedan arriba.";
  box.innerHTML=`<span class="eyebrow">Penales — decides tú</span>
    <p class="situacion">Los primeros cuatro: ${a} de 4 tuyos, ${bb} de 4 de ellos. Te toca el quinto. ${enJuego} La pelota pesa distinto ahora.</p>
    <div class="acciones"></div>`;
  const ops=[
    {txt:"Reventarla al medio", riesgo:"medio", p:.62, stat:"temple"},
    {txt:"Cruzarla al palo izquierdo", riesgo:"medio", p:.66, stat:"tecnica"},
    {txt:"Picarla por el medio", riesgo:"alto", p:.44, stat:"temple"},
  ];
  ops.forEach(op=>{
    const b=document.createElement("button"); b.className="accion";
    b.innerHTML=`<span>${op.txt}</span><span class="rg ${op.riesgo}">${op.riesgo}</span>`;
    b.onclick=()=>{
      box.remove();
      const [a,bb]=S.tanda;
      const ok = Math.random()<probFija(op.p,op.stat);
      setTimeout(()=>{
        S.penalMio = { tipo:"patear", ok };
        if(ok) linea("", op.txt+". <b>Adentro.</b>","gol");
        else { linea("", op.txt+". El arquero adivina. Te quedas mirando el punto del penal.","contra"); S.hitos.push("penal_fallado"); }
        cerrarTanda(a+(ok?1:0), bb+(Math.random()<0.74?1:0));
      },600);
    };
    box.querySelector(".acciones").appendChild(b);
  });
  $("#rl").appendChild(box); box.scrollIntoView({behavior:"smooth",block:"center"});
}

function decisionAtajar(){
  const box=document.createElement("div"); box.className="decision";
  const [a,bb]=tandaBase(); S.tanda=[a,bb];
  const enJuego = a>bb ? "Si la sacas, son campeones."
                : a<bb ? "Si la sacas, siguen vivos."
                : "Si la sacas, quedan a un penal del título.";
  box.innerHTML=`<span class="eyebrow">Penales — decides tú</span>
    <p class="situacion">Los primeros cuatro: ${a} de 4 tuyos, ${bb} de 4 de ellos. Quinto penal del rival y lo miras acomodar la pelota. ${enJuego}</p>
    <div class="acciones"></div>`;
  const ops=[
    {txt:"Tirarte a tu izquierda", riesgo:"alto", p:.30, stat:"temple"},
    {txt:"Tirarte a tu derecha", riesgo:"alto", p:.30, stat:"temple"},
    {txt:"Quedarte parado en el medio", riesgo:"alto", p:.26, stat:"temple"},
  ];
  ops.forEach(op=>{
    const b=document.createElement("button"); b.className="accion";
    b.innerHTML=`<span>${op.txt}</span><span class="rg ${op.riesgo}">${op.riesgo}</span>`;
    b.onclick=()=>{
      box.remove();
      const [a,bb]=S.tanda;
      const ok = Math.random()<probFija(op.p,op.stat);
      setTimeout(()=>{
        S.penalMio = { tipo:"atajar", ok };
        if(ok){ linea("", op.txt+". <b>La sacas.</b> Te levantas gritando antes de que la pelota deje de rodar.","gol"); S.hitos.push("atajada"); }
        else linea("", op.txt+". Te la puso del otro lado.","contra");
        cerrarTanda(a+(Math.random()<0.72?1:0), bb+(ok?0:1));
      },600);
    };
    box.querySelector(".acciones").appendChild(b);
  });
  $("#rl").appendChild(box); box.scrollIntoView({behavior:"smooth",block:"center"});
}

function simularTanda(){
  const [a,b]=tandaBase();
  linea("", "Desde afuera no se puede hacer nada. Solo mirar.","amb");
  setTimeout(()=>cerrarTanda(a+(Math.random()<.7?1:0), b+(Math.random()<.75?1:0)),900);
}

function cerrarTanda(a,b){
  let x=a,y=b,vueltas=0;
  while(x===y && vueltas<6){ if(Math.random()<0.72)x++; if(Math.random()<0.74)y++; vueltas++; }
  setTimeout(()=>{
    linea("", `<b>Tanda: ${x} — ${y}.</b>`, x>y?"gol":"contra");
    S.penalesRes=[x,y];
    S.ganaste = x>y;
    const m = S.penalMio;
    if(m){
      const clave = m.tipo + (m.ok?"_ok":"_no") + (S.ganaste?"_gano":"_perdio");
      S.hitos.push(clave);
      const cierre = {
        patear_ok_gano:   "El tuyo entró y el título se quedó. Vas a contar ese penal el resto de tu vida.",
        patear_ok_perdio: "El tuyo entró. El de otro no. Hiciste lo que tenías que hacer y no alcanzó, que es la forma más injusta de perder una final.",
        patear_no_gano:   "Fallaste el tuyo y salieron campeones igual. Estás festejando con una culpa rara adentro que nadie más entiende.",
        patear_no_perdio: "Fallaste el tuyo y perdieron. No hay mucho más que decir. Esa pelota te va a seguir un tiempo.",
        atajar_ok_gano:   "La sacaste y salieron campeones. Esa foto va a estar en la pared de un bar durante veinte años.",
        atajar_ok_perdio: "La sacaste y perdieron igual. Hiciste la atajada de tu vida en la tanda equivocada.",
        atajar_no_gano:   "No la sacaste y ganaron igual. Te salvaron los otros diez, y eso también es la tanda.",
        atajar_no_perdio: "No la sacaste y se acabó. Te quedas de rodillas mirando cómo festejan del otro lado.",
      }[clave];
      setTimeout(()=>linea("", cierre, "evento"), 600);
    }
    setTimeout(()=>terminar(true), 900);
  },700);
}

/* ── Epílogo ── */
function terminar(porPenales=false){
  S.fin=true;
  recordar([...S.usados]);
  const gano = porPenales? S.ganaste : S.gp>S.gr;
  const app=$("#app");
  const ep=document.createElement("div"); ep.className="epilogo";

  let veredicto = gano? "Campeón" : (S.gp===S.gr? "Perdiste en penales":"Perdiste la final");
  let texto = epilogo(gano);

  ep.innerHTML = `
    <span class="eyebrow">${S.final.torneo}</span>
    <div class="veredicto ${gano?'campeon':''}">${veredicto}</div>
    <p>${texto}</p>
    <div class="resumen">
      <div><span>Resultado</span><b>${S.final.equipo} ${S.gp} — ${S.gr} ${S.final.rival}${porPenales?` (${S.penalesRes.join("-")} pen.)`:""}</b></div>
      <div><span>Tu puesto</span><b>${sel.pos.nombre}</b></div>
      <div><span>Tus goles</span><b>${goles()}</b></div>
      <div><span>Tus asistencias</span><b>${asistencias()}</b></div>
      <div><span>Decisiones tomadas</span><b>${S.decisiones}</b></div>
      <div><span>${S.comodin.nombre}</span><b>${S.comodinUsado?"Usada":"Nunca se dio"}</b></div>
      <div><span>Terminaste</span><b>${S.roja?"Expulsado":S.amarilla?"Con amarilla":"En cancha"}</b></div>
      <div><span>Energía final</span><b>${Math.round(S.energia)}%</b></div>
    </div>
    <button class="cta" id="repetir">Repetir este partido</button>
    <div class="opts dos" style="margin-top:.5rem">
      <button class="pick" id="otroAzar" style="text-align:center"><span class="t">Otro al azar</span></button>
      <button class="pick" id="otra" style="text-align:center"><span class="t">Elegir de nuevo</span></button>
    </div>`;
  app.appendChild(ep);
  $("#repetir").onclick=()=>{ scrollTo(0,0); arrancar(); };
  $("#otroAzar").onclick=()=>{
    sel.pos = pick(POSICIONES);
    sel.comodin = pick(COMODINES[sel.pos.id]);
    let yo = pick(EQUIPOS), riv = pick(EQUIPOS);
    while(riv.nombre===yo.nombre) riv = pick(EQUIPOS);
    sel.final = construirFinal(yo, riv);
    scrollTo(0,0); arrancar();
  };
  $("#otra").onclick=()=>{ sel.pos=sel.comodin=sel.final=null; scrollTo(0,0); pantallaInicio(); };
  ep.scrollIntoView({behavior:"smooth",block:"start"});
}

const goles = ()=>S.hitos.filter(h=>h==="gol").length;
const asistencias = ()=>S.hitos.filter(h=>h==="asistencia").length;

function epilogo(gano){
  const h=S.hitos;
  const partes=[];
  if(h.includes("golazo")) partes.push("El gol que metiste lo van a repetir cada aniversario de esta final.");
  else if(h.includes("gol")) partes.push("Metiste un gol en una final. Eso ya no te lo saca nadie.");
  if(h.includes("asistencia")) partes.push("La asistencia fue tuya, aunque en la foto salga otro.");
  if(h.includes("atajar_ok_gano")) partes.push("La atajada en los penales es la imagen que va a quedar.");
  if(h.includes("roja") && h.includes("sacrificio"))
    partes.push(gano
      ? "Te expulsaron por salvar el partido y terminaste festejando desde el túnel. Nadie te va a discutir esa roja."
      : "Te expulsaron por salvar un gol que igual llegó después. Vas a pensar en esa jugada mucho tiempo.");
  else if(h.includes("roja")) partes.push("La expulsión te dejó viendo el final desde afuera.");
  if(h.includes("patear_no_gano")) partes.push("Vas a ser el campeón que falló el penal, y las dos cosas son ciertas al mismo tiempo.");
  else if(h.includes("penal_fallado")) partes.push("El penal que erraste te va a despertar de noche durante años.");
  if(h.includes("culpa") && !gano) partes.push("Hubo un gol que empezó en un error tuyo. Lo sabes tú y lo sabe el técnico.");
  if(h.includes("kirikocho")) partes.push("Hechizaste a un rival gritándole Kirikocho en una final y funcionó. No se lo cuentes a nadie que no sea de acá, no te van a creer.");
  if(h.includes("rebote")) partes.push("Fallaste el penal y la metieron en el rebote. Vas a tener que convivir con las dos cosas.");
  if(h.includes("provocacion")) partes.push("Lo de la tribuna visitante te lo van a recordar más que el gol.");
  if(h.includes("doble_amarilla")) partes.push("Dos amarillas por dos decisiones que tomaste vos. Nadie te obligó.");
  if(h.includes("clase")) partes.push("Te silbaron todo el partido y no les diste el gusto ni una vez.");
  if(h.includes("locura")) partes.push("Jugaste la carta que nadie juega y te salió. Eso se cuenta en las mesas por años.");
  if(h.includes("lujo")) partes.push("Definir así en una final es una declaración de personalidad.");
  if(!partes.length) partes.push(gano
    ? "No hiciste nada memorable, pero estuviste ahí y no te temblaron las piernas. A veces con eso alcanza."
    : "Jugaste una final entera sin brillar ni fallar. Es el destino de casi todos.");

  const cierre = gano
    ? `Levantas la copa en ${S.final.sede.split(",")[0]}. Mañana no vas a poder explicar bien lo que pasó.`
    : `${S.final.rival} da la vuelta olímpica y a ti te toca quedarte parado mirando. Ese es el precio de haber llegado.`;
  return partes.join(" ")+" "+cierre;
}

pantallaInicio();
</script>
